<SCRIPT LANGUAGE="JSCRIPT">

var tab_array = new Array();

// This is an example of a function which initializes the page
//
function InitDocument(document)
{
	setDirection();
	
	if (window.external.FindSymbol('DOCUMENT_FIRST_LOAD'))
	{
		// This function sets the default symbols based 
		// on the values specified in the SYMBOL tags above
		//
		window.external.SetDefaults(document);
	}

	// Load the document and initialize the controls 
	// with the appropriate symbol values
	//
	window.external.Load(document);
	
  if ( !window.external.FindSymbol('KS_EVENTS') )
	{
    ApplicationEvent.disabled = true;
    ApplicationEvent_LABEL.disabled = true;
    DocumentEvent.disabled = true;
    DocumentEvent_LABEL.disabled = true;
    Document2DEvent.disabled = true;
    Document2DEvent_LABEL.disabled = true;
    Document3DEvent.disabled = true;
    Document3DEvent_LABEL.disabled = true;
    Object2DEvent.disabled = true;
    Object2DEvent_LABEL.disabled = true;
    Object3DEvent.disabled = true;
    Object3DEvent_LABEL.disabled = true;
    SelectMngEvent.disabled = true;
    SelectMngEvent_LABEL.disabled = true;
    StampEvent.disabled = true;
    StampEvent_LABEL.disabled = true;
    SpcObjectEvent.disabled = true;
    SpcObjectEvent_LABEL.disabled = true; 
    SpecificationEvent.disabled = true;
    SpecificationEvent_LABEL.disabled = true;
    SpcDocumentEvent.disabled = true;
    SpcDocumentEvent_LABEL.disabled = true;
    DocumentFrameEvent.disabled = true;
    DocumentFrameEvent_LABEL.disabled = true;
    ViewsAndLayersEvent.disabled = true;
    ViewsAndLayersEvent_LABEL.disabled = true;
    LibMngEvent.disabled = true;
    LibMngEvent_LABEL.disabled = true;
    PropUserEvent.disabled = true;
    PropUserEvent_LABEL.disabled = true;
	}
	else
  {
    if ( !window.external.FindSymbol('USES_3D') )
    {
      Document3DEvent.disabled = true;
      Document3DEvent_LABEL.disabled = true;
      Object3DEvent.disabled = true;
      Object3DEvent_LABEL.disabled = true;
    }
    else
    {
      Document3DEvent.disabled = false;
      Document3DEvent_LABEL.disabled = false;
      Object3DEvent.disabled = false;
      Object3DEvent_LABEL.disabled = false;
    }
    
    if ( !window.external.FindSymbol('API7') )
    {
      DocumentFrameEvent.disabled = true;
      DocumentFrameEvent_LABEL.disabled = true;
      ViewsAndLayersEvent.disabled = true;
      ViewsAndLayersEvent_LABEL.disabled = true;
      LibMngEvent.disabled = true;
      LibMngEvent_LABEL.disabled = true;
    }
    else
    {
      DocumentFrameEvent.disabled = false;
      DocumentFrameEvent_LABEL.disabled = false;
      ViewsAndLayersEvent.disabled = false;
      ViewsAndLayersEvent_LABEL.disabled = false;
      LibMngEvent.disabled = false;
      LibMngEvent_LABEL.disabled = false;
    }
    
    if ( !window.external.FindSymbol('PROP_PANEL') )
    {
      PropUserEvent.disabled = true;
      PropUserEvent_LABEL.disabled = true;
    }
    else
    {
      PropUserEvent.disabled = false;
      PropUserEvent_LABEL.disabled = false;
    }
    ApplicationEvent.disabled = false;
    ApplicationEvent_LABEL.disabled = false;
    DocumentEvent.disabled = false;
    DocumentEvent_LABEL.disabled = false;
    Document2DEvent.disabled = false;
    Document2DEvent_LABEL.disabled = false;
    Object2DEvent.disabled = false;
    Object2DEvent_LABEL.disabled = false;
    SelectMngEvent.disabled = false;
    SelectMngEvent_LABEL.disabled = false;
    StampEvent.disabled = false;
    StampEvent_LABEL.disabled = false;
    SpcObjectEvent.disabled = false;
    SpcObjectEvent_LABEL.disabled = false; 
    SpecificationEvent.disabled = false;
    SpecificationEvent_LABEL.disabled = false;
    SpcDocumentEvent.disabled = false;
    SpcDocumentEvent_LABEL.disabled = false;
  }
}

// If the wizard has more than 1 page, this 
// function will browse to the page specified
//
function Next(document, linkto)
{
	window.external.Next(document, linkto);
}

// This is an example of a function which
// gets called when the user clicks on 'Finish'
//
function OnFinish(document)
{
	OnWizFinish(document);
}

function OnCheck()
{
  if ( Document2DEvent.checked    || Document3DEvent.checked      || Object2DEvent.checked    ||
       Object3DEvent.checked      || SelectMngEvent.checked       || StampEvent.checked       ||
       SpcObjectEvent.checked     || SpecificationEvent.checked   || SpcDocumentEvent.checked ||
       DocumentFrameEvent.checked || ViewsAndLayersEvent.checked )
    DocumentEvent.checked = true;
}
